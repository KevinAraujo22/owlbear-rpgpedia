<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; color: #e8e6f0; background: #17141f; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .box { background: #241f31; border-radius: 8px; padding: 10px; margin: 8px 0; }
      .total { font-size: 26px; font-weight: 800; float: right; }
      .dim { color: #a7a1b8; font-size: 12px; }
      ol { padding-left: 18px; margin: 6px 0 0; }
      a { color: #b794ff; }
    </style>
  </head>
  <body>
    <h1>RPGpédia → Owlbear</h1>
    <div class="box" id="last"><span class="dim">Nenhuma rolagem capturada ainda.</span></div>
    <div class="dim">
      Como usar:
      <ol>
        <li>Abra sua ficha no <a href="https://rpgpedia.com" target="_blank">rpgpedia.com</a>.</li>
        <li>Abra a sala no Owlbear com a extensão “Rolagens RPGpédia”.</li>
        <li>Role qualquer teste na ficha.</li>
      </ol>
      Se acabou de instalar ou atualizar esta extensão, recarregue as abas do rpgpedia e do Owlbear.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
